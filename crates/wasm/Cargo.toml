[package]
name = "sinksight-engine-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "WebAssembly bindings for the SinkSight analysis engine."

[lib]
name = "sinksight_engine"
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
sinksight-analysis = { path = "../analysis" }
tsify-next = { version = "0.5", features = ["wasm-bindgen"] }
wasm-bindgen = "0.2"
