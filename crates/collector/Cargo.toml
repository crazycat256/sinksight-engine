[package]
name = "sinksight-collector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Continuous JavaScript collection through Chrome DevTools Protocol."

[dependencies]
anyhow = "1"
base64 = "0.22"
csv = "1"
futures-util = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sinksight-analysis = { path = "../analysis" }
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.28"
url = "2"

[dev-dependencies]
tempfile = "3"
