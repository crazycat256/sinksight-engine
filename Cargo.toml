[package]
name = "sinksight-engine"
version = "0.1.6"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/crazycat256/sinksight-engine"
description = "DOM XSS analysis for JavaScript."

[workspace]
members = ["crates/wasm"]
resolver = "2"

[workspace.package]
version = "0.1.6"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/crazycat256/sinksight-engine"

[dependencies]
oxc_allocator = "0.151.0"
oxc_ast = "0.151.0"
oxc_ast_visit = "0.151.0"
oxc_parser = "0.151.0"
oxc_semantic = "0.151.0"
oxc_span = "0.151.0"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
sinksight-library-hash = { version = "0.1.3", git = "https://github.com/crazycat256/sinksight-library-hash.git", rev = "46b4595187d987b9ca02ef63c57abee54866fd0d" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
stacker = "0.1"

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.release.package.sinksight-engine-wasm]
opt-level = "z"
