[package]
name = "sinksight-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Continuous DOM XSS analysis for JavaScript observed through Chrome DevTools Protocol."
repository = "https://github.com/crazycat256/sinksight-engine"

[[bin]]
name = "sinksight"
path = "src/main.rs"

[lib]
name = "sinksight_engine"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
csv = "1"
futures-util = "0.3"
oxc_allocator = "0.110.0"
oxc_ast = "0.110.0"
oxc_ast_visit = "0.110.0"
oxc_codegen = "0.110.0"
oxc_parser = "0.110.0"
oxc_semantic = "0.110.0"
oxc_span = "0.110.0"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sinksight-library-hash = { git = "https://github.com/crazycat256/sinksight-library-hash.git", rev = "3eee363a7711f7eb8fbb2627721d757724b41f34" }
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.28"
url = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
