name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write

jobs:
  linux-x86_64:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Determine release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "sinksight-cli") | .version')"
          if [[ -z "$version" ]]; then
            echo "Cannot find the sinksight-cli version" >&2
            exit 1
          fi
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Release $tag already exists"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.publish == 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.version.outputs.publish == 'true'
        run: cargo build --release --locked -p sinksight-cli
      - name: Prepare binary
        if: steps.version.outputs.publish == 'true'
        id: binary
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          asset="sinksight-${RELEASE_TAG}-x86_64-unknown-linux-gnu"
          install -m 0755 target/release/sinksight "$asset"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$asset" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
          RELEASE_ASSET: ${{ steps.binary.outputs.asset }}
          RELEASE_SHA256: ${{ steps.binary.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" \
            -f target_commitish="$RELEASE_COMMIT" \
            --jq .body > release-notes.md
          printf '\n## SHA-256\n\n```text\n%s  %s\n```\n' "$RELEASE_SHA256" "$RELEASE_ASSET" >> release-notes.md
          gh release create "$RELEASE_TAG" \
            --target "$RELEASE_COMMIT" \
            --notes-file release-notes.md \
            "$RELEASE_ASSET"
