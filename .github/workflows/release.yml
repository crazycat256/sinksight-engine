name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p sinksight-cli
      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          archive="sinksight-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz"
          staging="sinksight-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu"
          mkdir "$staging"
          cp target/release/sinksight LICENSE README.md "$staging/"
          tar -czf "$archive" "$staging"
          sha256sum "$archive" > "$archive.sha256"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes sinksight-*.tar.gz sinksight-*.sha256
